<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:   #0a0a0a;
      --bg-panel:     #111111;
      --bg-controls:  #161616;
      --border:       #2a2a2a;
      --accent:       #00e5ff;
      --accent-dim:   rgba(0, 229, 255, 0.15);
      --text-primary: #e8e8e8;
      --text-muted:   #555;
      --text-log:     #33ff99;
      --btn-hover:    #1f1f1f;
      --btn-active:   #252525;
      --radius:       4px;
    }

    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Courier New', 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── MAIN DISPLAY AREA ─────────────────────────────── */
    #display-area {
      flex: 1;
      position: relative;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* image from C++ */
    #cpp-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      z-index: 1;
    }

    /* log overlay */
    #log-panel {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 14px 18px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-log);
      background: transparent;
      pointer-events: none; /* clicks pass through to image */
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #log-panel.has-image {
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.75) 0%,
        rgba(0,0,0,0.0)  40%,
        rgba(0,0,0,0.0)  60%,
        rgba(0,0,0,0.75) 100%
      );
    }

    .log-entry {
      display: flex;
      gap: 10px;
      margin-bottom: 2px;
    }
    .log-entry .ts  { color: var(--text-muted); flex-shrink: 0; }
    .log-entry .msg { color: var(--text-log); word-break: break-all; }
    .log-entry.warn  .msg { color: #ffcc00; }
    .log-entry.error .msg { color: #ff4d4d; }
    .log-entry.info  .msg { color: #00e5ff; }

    /* empty state label */
    #empty-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    /* ── CONTROLS BAR ───────────────────────────────────── */
    #controls-bar {
      flex-shrink: 0;
      height: 64px;
      background: var(--bg-controls);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    /* left: transport buttons */
    .transport {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      outline: none;
    }
    .ctrl-btn:hover  { background: var(--btn-hover); border-color: #3a3a3a; }
    .ctrl-btn:active { background: var(--btn-active); }
    .ctrl-btn:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }

    .ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* play button is slightly larger / accent tinted */
    #btn-play {
      width: 44px;
      height: 44px;
      border-color: var(--accent);
      color: var(--accent);
    }
    #btn-play:hover { background: var(--accent-dim); }

    /* center: progress + time */
    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 600px;
    }

    #progress-track {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s linear;
      pointer-events: none;
    }
    #progress-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      pointer-events: none;
      transition: left 0.3s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* right: image open + log toggle */
    .side-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      outline: none;
      white-space: nowrap;
    }
    .icon-btn:hover  { color: var(--text-primary); border-color: #3a3a3a; background: var(--btn-hover); }
    .icon-btn:active { background: var(--btn-active); }
    .icon-btn:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .icon-btn svg { width: 13px; height: 13px; fill: currentColor; }

    .icon-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

    /* status dot */
    #status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    #status-dot.connected { background: #33ff99; box-shadow: 0 0 5px #33ff99; }
  </style>
</head>
<body>

  <!-- ── DISPLAY AREA ── -->
  <div id="display-area">
    <span id="empty-label">LOG</span>
    <img id="cpp-image" alt="C++ image" />
    <div id="log-panel"></div>
  </div>

  <!-- ── CONTROLS BAR ── -->
  <div id="controls-bar">

    <!-- Transport -->
    <div class="transport">
      <button class="ctrl-btn" id="btn-prev" title="Previous" onclick="UI.prev()">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-play" title="Play / Pause" onclick="UI.togglePlay()">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Next" onclick="UI.next()">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <!-- Side actions -->
    <div class="side-actions">
      <div id="status-dot" title="Backend connection status"></div>

      <button class="icon-btn" id="btn-open-image" title="Open image from C++ backend" onclick="UI.requestImage()">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        Open Image
      </button>

      <button class="icon-btn" id="btn-log-toggle" title="Toggle log overlay" onclick="UI.toggleLog()">
        <svg viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
        Log
      </button>
    </div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════════════
  //  UI STATE
  // ═══════════════════════════════════════════════════════════
  const state = {
    playing:     false,
    logVisible:  true,
    progress:    0,       // 0-100
    currentTime: 0,
    totalTime:   0,
    connected:   false,
  };

  // ═══════════════════════════════════════════════════════════
  //  DOM REFS
  // ═══════════════════════════════════════════════════════════
  const $ = id => document.getElementById(id);
  const logPanel      = $('log-panel');
  const cppImage      = $('cpp-image');
  const emptyLabel    = $('empty-label');
  const progressFill  = $('progress-fill');
  const progressThumb = $('progress-thumb');
  const timeCurrent   = $('time-current');
  const timeTotal     = $('time-total');
  const iconPlay      = $('icon-play');
  const iconPause     = $('icon-pause');
  const statusDot     = $('status-dot');
  const btnLogToggle  = $('btn-log-toggle');

  // ═══════════════════════════════════════════════════════════
  //  LOGGING
  // ═══════════════════════════════════════════════════════════
  function ts() {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}.${String(n.getMilliseconds()).padStart(3,'0')}`;
  }

  /**
   * Append a log entry.
   * @param {string} msg
   * @param {'log'|'info'|'warn'|'error'} level
   */
  function appendLog(msg, level = 'log') {
    emptyLabel.style.display = 'none';

    const entry = document.createElement('div');
    entry.className = `log-entry ${level}`;
    entry.innerHTML = `<span class="ts">[${ts()}]</span><span class="msg">${escHtml(msg)}</span>`;
    logPanel.appendChild(entry);
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ═══════════════════════════════════════════════════════════
  //  PROGRESS / TIME HELPERS
  // ═══════════════════════════════════════════════════════════
  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function setProgress(pct) {
    state.progress = Math.min(100, Math.max(0, pct));
    progressFill.style.width  = state.progress + '%';
    progressThumb.style.left  = state.progress + '%';
  }

  function setTime(current, total) {
    state.currentTime = current;
    state.totalTime   = total;
    timeCurrent.textContent = fmtTime(current);
    timeTotal.textContent   = fmtTime(total);
    if (total > 0) setProgress((current / total) * 100);
  }

  // ═══════════════════════════════════════════════════════════
  //  IMAGE DISPLAY
  // ═══════════════════════════════════════════════════════════
  function showImage(src) {
    cppImage.src = src;
    cppImage.style.display = 'block';
    logPanel.classList.add('has-image');
    appendLog(`Image loaded: ${src}`, 'info');
  }

  function clearImage() {
    cppImage.style.display = 'none';
    cppImage.src = '';
    logPanel.classList.remove('has-image');
  }

  // ═══════════════════════════════════════════════════════════
  //  BACKEND BRIDGE (C++ → JS)
  //  C++ injects calls into this namespace.
  // ═══════════════════════════════════════════════════════════
  window.CppBridge = {

    /** Called by C++ to push a log line */
    log(msg, level = 'log') {
      appendLog(msg, level);
    },

    /** Called by C++ to display an image (base64 data-URI or file:// path) */
    showImage(src) {
      showImage(src);
    },

    /** Called by C++ to update playback time */
    setTime(currentSec, totalSec) {
      setTime(currentSec, totalSec);
    },

    /** Called by C++ to set play/pause state */
    setPlaying(isPlaying) {
      state.playing = isPlaying;
      iconPlay.style.display  = isPlaying ? 'none'  : 'block';
      iconPause.style.display = isPlaying ? 'block' : 'none';
    },

    /** Called by C++ to signal connection ready */
    onConnected() {
      state.connected = true;
      statusDot.classList.add('connected');
      appendLog('Backend connected.', 'info');
    },

    /** Called by C++ to signal disconnection */
    onDisconnected() {
      state.connected = false;
      statusDot.classList.remove('connected');
      appendLog('Backend disconnected.', 'warn');
    },

    /** Called by C++ to clear the image */
    clearImage() {
      clearImage();
    },
  };

  // ═══════════════════════════════════════════════════════════
  //  UI ACTIONS  (JS → C++)
  //  These call into the C++ host via the WebView binding.
  //  Replace window.cppHost.<method>() with your actual
  //  binding name (e.g. webkit.messageHandlers.X.postMessage,
  //  CefV8Value, WebView2 AddHostObjectToScript, etc.)
  // ═══════════════════════════════════════════════════════════
  function callCpp(method, ...args) {
    // ── WebView2 (Windows)  ──────────────────────────────────
    if (window.chrome?.webview?.hostObjects?.cppHost) {
      window.chrome.webview.hostObjects.cppHost[method](...args);
      return;
    }
    // ── WKWebView (macOS/iOS) ────────────────────────────────
    if (window.webkit?.messageHandlers?.cppHost) {
      window.webkit.messageHandlers.cppHost.postMessage({ method, args });
      return;
    }
    // ── CEF / custom binding ─────────────────────────────────
    if (window.cppHost) {
      if (typeof window.cppHost[method] === 'function') {
        window.cppHost[method](...args);
        return;
      }
    }
    // ── Fallback: log locally ────────────────────────────────
    appendLog(`[no backend] ${method}(${args.map(JSON.stringify).join(', ')})`, 'warn');
  }

  window.UI = {
    togglePlay() {
      callCpp('togglePlay');
    },
    prev() {
      callCpp('prev');
      appendLog('← Previous', 'log');
    },
    next() {
      callCpp('next');
      appendLog('→ Next', 'log');
    },
    seek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct  = ((e.clientX - rect.left) / rect.width) * 100;
      setProgress(pct);
      const seekSec = (pct / 100) * state.totalTime;
      callCpp('seek', seekSec);
    },
    requestImage() {
      callCpp('openImage');
      appendLog('Requesting image from backend…', 'info');
    },
    toggleLog() {
      state.logVisible = !state.logVisible;
      logPanel.style.display = state.logVisible ? 'block' : 'none';
      btnLogToggle.classList.toggle('active', state.logVisible);
    },
  };

  // ═══════════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════════
  appendLog('UI ready. Waiting for backend…', 'info');
  </script>
</body>
</html>
